<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    body {font-family: "Microsoft YaHei", "Noto Serif SC", "SimSun", serif; max-width: 1120px; margin: 40px auto; padding: 0 28px; color: #20242a; line-height: 1.75;}
    h1 {color: #17324d; border-bottom: 3px solid #2f6b8a; padding-bottom: 12px;}
    h2 {color: #2f6b8a; margin-top: 2em;}
    .meta {color: #667085; font-family: Arial, sans-serif; font-size: .9rem;}
    .figure-grid {display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start;}
    figure {margin: 0; padding: 13px; background: #f7f9fb; border: 1px solid #dce3e9; border-radius: 8px; break-inside: avoid;}
    figure img {display: block; width: 100%; height: 270px; object-fit: contain; margin: auto; background: #fff;}
    figcaption {margin-top: 10px; color: #344054; font-size: .9rem; line-height: 1.62; text-align: justify;}
    @media (max-width: 760px) {.figure-grid {grid-template-columns: 1fr;} figure img {height: auto; max-height: 360px;}}
    @media print {body {margin: 0; max-width: none;} .figure-grid {grid-template-columns: repeat(2, minmax(0, 1fr));} figure {page-break-inside: avoid;} figure img {height: 220px;}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({startOnLoad: true, theme: 'default', flowchart: {useMaxWidth: true, htmlLabels: true}});</script>
</head>
<body>
{{BODY}}
</body>
</html>
