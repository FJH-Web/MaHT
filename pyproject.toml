[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "statagent"
version = "0.1.0"
description = "A hypothesis-centric statistical inference framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "StatAgent Contributors"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
web = ["streamlit>=1.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["statagent"]
